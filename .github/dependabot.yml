version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The app framework and build tools come from Lovable's template and move
    # together; Lovable updates them. Bumping them here breaks the server functions.
    ignore:
      - dependency-name: "@tanstack/*"
      - dependency-name: "@lovable.dev/*"
      - dependency-name: "vite"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
